name: Run

on: [push]

env:
  node_version: "20.x"

jobs:
  run-action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.node_version }}
        cache: "npm"
    - name: Install JS dependencies
      run: npm install
    - name: Build
      run: npm run build
    - name: Run action
      uses: ./
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        age: '1 second'
        skip-tags: true
        skip-recent: 1

  create-test-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Create artifact for testing
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: ./
